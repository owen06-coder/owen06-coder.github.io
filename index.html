<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wen-Te Chien | Course Homepage</title>
    <!-- Google Fonts 導入乾淨現代的英文字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            max-width: 520px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
        }

        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: block;
            border: 3px solid var(--border-color);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .tagline {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .info-box {
            background-color: #f1f5f9;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 28px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.95rem;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-value {
            font-weight: 600;
            color: var(--text-main);
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-secondary {
            background-color: #ffffff;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 自動帶入你的 GitHub 頭像 -->
        <img class="avatar" src="https://github.com/owen06-coder.png" alt="GitHub Avatar">
        
        <h1>簡文得 (Owen)</h1>
        <p class="tagline">Personal Course Homepage</p>

        <div class="info-box">
            <div class="info-item">
                <span class="info-label">Course</span>
                <span class="info-value">11501_CS203A</span>
            </div>
            <div class="info-item">
                <span class="info-label">Student ID</span>
                <span class="info-value">1141529</span>
            </div>
            <div class="info-item">
                <span class="info-label">Subject</span>
                <span class="info-value">Data Structures</span>
            </div>
        </div>

        <div class="actions">
            <a class="btn btn-primary" href="https://github.com/owen06-coder/11501_CS203A" target="_blank">
                View Course Repository
            </a>
            <a class="btn btn-secondary" href="https://github.com/owen06-coder" target="_blank">
                GitHub Profile
            </a>
        </div>

        <footer>
            Built with GitHub Pages &bull; 2026
        </footer>
    </div>

</body>
</html>
